<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RentUp — Sign In</title>
  <meta name="description" content="RentUp — Modern rental property management for landlords.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('rentup_theme')||'light');</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="auth-container">
    <div class="auth-card glass slide-up">
      <div class="logo">
        <h1 data-i18n="app_name">RentUp</h1>
        <p data-i18n="app_tagline">Rental Property Management</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" data-i18n="auth_signin">Sign In</button>
        <button class="auth-tab" data-tab="register" data-i18n="auth_create_account">Create Account</button>
      </div>
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email" data-i18n="auth_email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password" data-i18n="auth_password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" data-i18n="auth_signin">Sign In</button>
      </form>
      <form id="register-form" class="auth-form" style="display:none;">
        <div class="form-group">
          <label for="register-name" data-i18n="auth_name">Full Name</label>
          <input type="text" id="register-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="register-email" data-i18n="auth_email">Email Address</label>
          <input type="email" id="register-email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="register-password" data-i18n="auth_password">Password</label>
          <input type="password" id="register-password" class="form-control" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="register-confirm" data-i18n="auth_confirm_password">Confirm Password</label>
          <input type="password" id="register-confirm" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" data-i18n="auth_create_account">Create Account</button>
      </form>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
