<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RentUp — Billing</title>
  <meta name="description" content="Generate and manage monthly bills for your rental properties.">
  <link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6c5ce7"><meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('rentup_theme')||'light');</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="app-layout">
    <div class="hamburger" id="sidebar-toggle">
      <span></span><span></span><span></span>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><i data-lucide="home"></i> <span>RentUp</span></div>
      <nav>
        <a href="dashboard.html" class="nav-link" data-page="dashboard"><i data-lucide="layout-dashboard"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
        <a href="billing.html" class="nav-link" data-page="billing"><i data-lucide="receipt"></i> <span data-i18n="nav_billing">Billing</span></a>
        <a href="properties.html" class="nav-link" data-page="properties"><i data-lucide="building-2"></i> <span data-i18n="nav_properties">Properties</span></a>
        <a href="rooms.html" class="nav-link" data-page="rooms"><i data-lucide="door-open"></i> <span data-i18n="nav_rooms">Rooms</span></a>
        <a href="settings.html" class="nav-link" data-page="settings"><i data-lucide="settings"></i> <span data-i18n="nav_settings">Settings</span></a>
      </nav>
      <div class="nav-bottom"><div class="user-info"><div class="user-avatar">U</div><div><div class="user-name">User</div><div class="user-email">user@email.com</div></div></div><button class="nav-link" onclick="Utils.logout()"><i data-lucide="log-out"></i> <span data-i18n="nav_signout">Sign Out</span></button></div>
    </aside>
    <main class="main-content">
      <div class="top-bar"><button class="top-bar-btn" id="btn-toggle-theme" title="Toggle theme"><i data-lucide="moon"></i></button><button class="top-bar-btn" id="btn-toggle-lang" title="Language">हि</button></div>
      <div class="page-header">
        <div><h1 data-i18n="nav_billing">Billing</h1><p class="subtitle" data-i18n="dash_billing_subtitle">Generate and manage monthly bills</p></div>
        <div class="actions-row" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" id="btn-export-all-pdf"><i data-lucide="file-text"></i> <span data-i18n="bill_export_all_pdf">Export All PDF</span></button>
          <button class="btn btn-secondary btn-sm" id="btn-export-all-excel"><i data-lucide="file-spreadsheet"></i> <span data-i18n="bill_export_all_excel">Export All Excel</span></button>
          <button class="btn btn-primary btn-sm" id="btn-add-bill"><i data-lucide="plus"></i> <span data-i18n="bill_new">New Bill</span></button>
        </div>
      </div>
      <!-- Global Filters -->
      <div class="filters-bar">
        <select id="filter-year" class="form-control" style="width:110px"></select>
        <select id="filter-month-num" class="form-control" style="width:130px"><option value="">All Months</option></select>
        <select id="filter-property" class="form-control"><option value="" data-i18n="room_all_properties">All Properties</option></select>
      </div>
      <div class="section-divider" style="margin-top:20px;display:flex;justify-content:flex-end">
        <input type="text" id="search-billing" class="form-control" placeholder="Search bills..." style="width:250px">
      </div>
      <div class="glass-static" style="padding:16px">
        <div class="table-container">
          <table id="bills-table">
            <thead><tr>
              <th data-sort="tenant_name" data-i18n="th_tenant">Tenant <span class="sort-icon">⇅</span></th>
              <th data-sort="room_name" data-i18n="th_room">Room <span class="sort-icon">⇅</span></th>
              <th data-sort="property_name" data-i18n="th_property">Property <span class="sort-icon">⇅</span></th>
              <th data-sort="month" data-i18n="th_month">Month <span class="sort-icon">⇅</span></th>
              <th data-sort="rent_amount" data-i18n="th_rent">Rent <span class="sort-icon">⇅</span></th>
              <th data-sort="electricity_units" data-i18n="th_elec_units">Elec Units <span class="sort-icon">⇅</span></th>
              <th data-sort="electricity_amount" data-i18n="th_elec_amount">Elec Amt <span class="sort-icon">⇅</span></th>
              <th data-sort="gas_units" data-i18n="th_gas_units">Gas Unit <span class="sort-icon">⇅</span></th>
              <th data-sort="gas_amount" data-i18n="th_gas">Gas <span class="sort-icon">⇅</span></th>
              <th data-sort="total_amount" data-i18n="th_total">Total <span class="sort-icon">⇅</span></th>
              <th data-sort="is_paid" data-i18n="th_status">Status <span class="sort-icon">⇅</span></th>
              <th data-i18n="th_actions">Actions</th>
            </tr></thead>
            <tbody id="bills-body"><tr><td colspan="12" class="empty-state" style="padding:36px"><div class="e-icon"><i data-lucide="receipt"></i></div><p data-i18n="dash_no_bills">No bills found</p></td></tr></tbody>
          </table>
        </div>
      </div>
      <!-- Bill Modal -->
      <div class="modal-overlay" id="bill-modal">
        <div class="modal glass-static">
          <div class="modal-header"><h2 id="bill-modal-title" data-i18n="bill_new_title">New Bill</h2><button class="modal-close" onclick="$('#bill-modal').removeClass('active')">✕</button></div>
          <form id="bill-form">
            <input type="hidden" id="bill-id">
            <div class="form-group"><label data-i18n="th_property">Property</label><select id="bill-property" class="form-control" required><option value="" data-i18n="bill_select_property">Select property</option></select></div>
            <div class="form-group"><label data-i18n="th_room">Room</label><select id="bill-room" class="form-control" required><option value="" data-i18n="bill_select_room_opt">Select room</option></select></div>
            <div class="form-group"><label data-i18n="bill_month">Month</label><input type="month" id="bill-month" class="form-control" required></div>
            <div class="form-group"><label data-i18n="bill_rent_override">Rent Amount</label><input type="number" id="bill-rent" class="form-control" min="0" step="100"></div>
            <div class="form-group"><label data-i18n="bill_elec_units">Electricity Units</label><input type="number" id="bill-elec-units" class="form-control" placeholder="0" min="0" step="0.1"></div>
            <div class="form-group"><label data-i18n="bill_gas_units">Gas Units</label><input type="number" id="bill-gas-units" class="form-control" placeholder="0" min="0" step="0.1"></div>
            <div class="form-group"><label data-i18n="bill_gas_amount">Gas Amount</label><input type="number" id="bill-gas-amount" class="form-control" placeholder="0" min="0" step="1"></div>
            <div class="form-group"><label data-i18n="bill_notes">Notes</label><textarea id="bill-notes" class="form-control"></textarea></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="$('#bill-modal').removeClass('active')" data-i18n="cancel">Cancel</button><button type="submit" class="btn btn-primary" data-i18n="bill_save">Save Bill</button></div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/fontData.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/billing.js"></script>
</body>
</html>
