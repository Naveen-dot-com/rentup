<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RentUp — Dashboard</title>
  <meta name="description" content="Dashboard — View your rental property statistics and revenue charts.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('rentup_theme')||'light');</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-mesh"></div>
  <button class="sidebar-toggle" id="sidebar-toggle"><i data-lucide="menu"></i></button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><i data-lucide="home"></i> <span>RentUp</span></div>
      <nav>
        <a href="dashboard.html" class="nav-link" data-page="dashboard"><i data-lucide="layout-dashboard"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
        <a href="billing.html" class="nav-link" data-page="billing"><i data-lucide="receipt"></i> <span data-i18n="nav_billing">Billing</span></a>
        <a href="properties.html" class="nav-link" data-page="properties"><i data-lucide="building-2"></i> <span data-i18n="nav_properties">Properties</span></a>
        <a href="rooms.html" class="nav-link" data-page="rooms"><i data-lucide="door-open"></i> <span data-i18n="nav_rooms">Rooms</span></a>
        <a href="settings.html" class="nav-link" data-page="settings"><i data-lucide="settings"></i> <span data-i18n="nav_settings">Settings</span></a>
      </nav>
      <div class="nav-bottom">
        <div class="user-info"><div class="user-avatar">U</div><div><div class="user-name">User</div><div class="user-email">user@email.com</div></div></div>
        <button class="nav-link" onclick="Utils.logout()"><i data-lucide="log-out"></i> <span data-i18n="nav_signout">Sign Out</span></button>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar">
        <button class="top-bar-btn" id="btn-toggle-theme" title="Toggle theme"><i data-lucide="moon"></i></button>
        <button class="top-bar-btn" id="btn-toggle-lang" title="Language">हि</button>
      </div>
      <div class="page-header">
        <div><h1 data-i18n="dash_title">Dashboard</h1><p class="subtitle" data-i18n="dash_subtitle">Welcome back! Here's your overview.</p></div>
        <button class="btn btn-secondary btn-sm" id="btn-dash-pdf"><i data-lucide="file-text"></i> <span data-i18n="dash_download_pdf">Download Report</span></button>
      </div>
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card glass slide-up"><div class="stat-icon purple"><i data-lucide="building-2"></i></div><div class="stat-value" id="stat-properties">--</div><div class="stat-label" data-i18n="dash_properties">Properties</div></div>
        <div class="stat-card glass slide-up"><div class="stat-icon green"><i data-lucide="door-open"></i></div><div class="stat-value" id="stat-rooms">--</div><div class="stat-label" data-i18n="dash_rooms">Rooms</div></div>
        <div class="stat-card glass slide-up"><div class="stat-icon yellow"><i data-lucide="indian-rupee"></i></div><div class="stat-value" id="stat-revenue">--</div><div class="stat-label" data-i18n="dash_monthly_revenue">Monthly Revenue</div></div>
        <div class="stat-card glass slide-up"><div class="stat-icon red"><i data-lucide="alert-circle"></i></div><div class="stat-value" id="stat-unpaid">--</div><div class="stat-label" data-i18n="dash_unpaid_bills">Unpaid Bills</div></div>
      </div>
      <!-- Charts -->
      <div class="section-divider"><h2><i data-lucide="bar-chart-3"></i> <span data-i18n="dash_charts">Revenue Overview</span></h2><p class="subtitle" data-i18n="dash_revenue_chart">Monthly Breakdown</p></div>
      <div class="charts-grid">
        <div class="chart-card glass-static"><canvas id="chart-revenue"></canvas></div>
        <div class="chart-card glass-static"><canvas id="chart-breakdown"></canvas></div>
      </div>
      <!-- Recent Activity -->
      <div class="section-divider" style="margin-top:28px"><h2><i data-lucide="clock"></i> <span data-i18n="dash_recent_bills">Recent Activity</span></h2></div>
      <div class="glass-static" style="padding:16px">
        <div class="table-container">
          <table><thead><tr><th data-i18n="th_tenant">Tenant</th><th data-i18n="th_room">Room</th><th data-i18n="th_property">Property</th><th data-i18n="th_month">Month</th><th data-i18n="th_total">Total</th><th data-i18n="th_status">Status</th></tr></thead>
          <tbody id="recent-body"><tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)" data-i18n="dash_no_bills">No bills found</td></tr></tbody></table>
        </div>
      </div>
    </main>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
