<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentUp — Dashboard</title>
  <meta name="description" content="RentUp Dashboard — View property stats, revenue, and recent billing activity.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c6cf0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-mesh"></div>
  <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">🏠 RentUp</div>
      <nav>
        <a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="icon">📊</span> Dashboard</a>
        <a href="properties.html" class="nav-link" data-page="properties"><span class="icon">🏢</span> Properties</a>
        <a href="rooms.html" class="nav-link" data-page="rooms"><span class="icon">🚪</span> Rooms</a>
        <a href="billing.html" class="nav-link" data-page="billing"><span class="icon">💰</span> Billing</a>
        <a href="settings.html" class="nav-link" data-page="settings"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="nav-bottom">
        <div class="user-info">
          <div class="user-avatar">U</div>
          <div>
            <div class="user-name">User</div>
            <div class="user-email">user@email.com</div>
          </div>
        </div>
        <button class="nav-link" onclick="Utils.logout()"><span class="icon">🚪</span> Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Dashboard</h1>
          <p class="subtitle">Welcome back! Here's your overview.</p>
        </div>
        <div class="filters-bar">
          <input type="month" id="dashboard-month" class="form-control" title="Select month">
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card glass slide-up">
          <div class="stat-icon purple">🏢</div>
          <div class="stat-value" id="stat-properties">0</div>
          <div class="stat-label">Properties</div>
        </div>
        <div class="stat-card glass slide-up">
          <div class="stat-icon green">🚪</div>
          <div class="stat-value" id="stat-rooms">0</div>
          <div class="stat-label">Rooms</div>
        </div>
        <div class="stat-card glass slide-up">
          <div class="stat-icon yellow">💰</div>
          <div class="stat-value" id="stat-revenue">PKR 0</div>
          <div class="stat-label">Monthly Revenue</div>
        </div>
        <div class="stat-card glass slide-up">
          <div class="stat-icon red">📋</div>
          <div class="stat-value" id="stat-unpaid">0</div>
          <div class="stat-label">Unpaid Bills</div>
        </div>
      </div>

      <!-- Recent Bills -->
      <div class="glass-static" style="padding: 24px; margin-top: 8px;">
        <h2 style="font-family:var(--font-heading);font-size:1.15rem;margin-bottom:16px;">Recent Bills</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Property</th>
                <th>Room</th>
                <th>Month</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recent-bills-body">
              <tr><td colspan="5" class="empty-state" style="padding:40px"><p>No bills yet</p></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
