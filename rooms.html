<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentUp — Rooms</title>
  <meta name="description" content="Manage rooms within your rental properties.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c6cf0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-mesh"></div>
  <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">🏠 RentUp</div>
      <nav>
        <a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="icon">📊</span> Dashboard</a>
        <a href="properties.html" class="nav-link" data-page="properties"><span class="icon">🏢</span> Properties</a>
        <a href="rooms.html" class="nav-link" data-page="rooms"><span class="icon">🚪</span> Rooms</a>
        <a href="billing.html" class="nav-link" data-page="billing"><span class="icon">💰</span> Billing</a>
        <a href="settings.html" class="nav-link" data-page="settings"><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="nav-bottom">
        <div class="user-info">
          <div class="user-avatar">U</div>
          <div><div class="user-name">User</div><div class="user-email">user@email.com</div></div>
        </div>
        <button class="nav-link" onclick="Utils.logout()"><span class="icon">🚪</span> Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Rooms</h1>
          <p class="subtitle">Manage rooms across your properties</p>
        </div>
        <button class="btn btn-primary" id="btn-add-room">+ Add Room</button>
      </div>

      <div class="filters-bar">
        <select id="filter-property" class="form-control">
          <option value="">All Properties</option>
        </select>
      </div>

      <div class="cards-grid" id="rooms-grid">
        <div class="empty-state glass-static" style="grid-column:1/-1;padding:60px">
          <div class="icon">🚪</div><h3>No rooms yet</h3><p>Add rooms to your properties</p>
        </div>
      </div>

      <!-- Room Modal -->
      <div class="modal-overlay" id="room-modal">
        <div class="modal glass-static">
          <div class="modal-header">
            <h2 id="room-modal-title">Add Room</h2>
            <button class="modal-close" onclick="$('#room-modal').removeClass('active')">✕</button>
          </div>
          <form id="room-form">
            <input type="hidden" id="room-id">
            <div class="form-group">
              <label for="room-property">Property</label>
              <select id="room-property" class="form-control" required>
                <option value="">Select a property</option>
              </select>
            </div>
            <div class="form-group">
              <label for="room-name">Room Name / Number</label>
              <input type="text" id="room-name" class="form-control" placeholder="e.g. Room 101" required>
            </div>
            <div class="form-group">
              <label for="room-rent">Default Monthly Rent</label>
              <input type="number" id="room-rent" class="form-control" placeholder="e.g. 15000" min="0" step="100" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="$('#room-modal').removeClass('active')">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Room</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/rooms.js"></script>
</body>
</html>
